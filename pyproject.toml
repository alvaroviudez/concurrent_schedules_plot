[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concurrent-schedules-plot"
version = "0.1.0"
description = "Tools to analyze and plot concurrent reinforcement schedules"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mpl",
    "ruff",
]

[tool.ruff]
line-length = 100