name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest --mpl

      - name: Generate baseline images (temporary)
        if: failure()
        run: pytest --mpl-generate-path=tests/baseline_new

      - name: Upload new baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new-baselines
          path: tests/baseline_new/